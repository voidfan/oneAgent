services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: xagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xagent}
      POSTGRES_USER: ${POSTGRES_USER:-xagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xagent_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: xagent-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: xagent-backend
    container_name: xagent-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-xagent}:${POSTGRES_PASSWORD:-xagent_secret}@postgres:5432/${POSTGRES_DB:-xagent}
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      - chromadb_data:/app/chroma_data
      - settings_data:/app/data
    expose:
      - "8000"

  # Frontend
  frontend:
    image: xagent-frontend
    container_name: xagent-frontend
    restart: unless-stopped
    expose:
      - "80"

  # Nginx Reverse Proxy (port 8088)
  nginx:
    image: nginx:alpine
    container_name: xagent-nginx
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  chromadb_data:
  settings_data:
